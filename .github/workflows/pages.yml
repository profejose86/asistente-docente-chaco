name: Publicar ADC staging

on:
  push:
    branches: [log-in, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adc-github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == (vars.ADC_PAGES_BRANCH || 'log-in')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      ADC_AUTH_MODE: supabase
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      ADC_GOOGLE_AUTH_ENABLED: 'false'
      ADC_EMAIL_CONFIRMATIONS_REQUIRED: ${{ vars.ADC_EMAIL_CONFIRMATIONS_REQUIRED || 'true' }}
      ADC_PASSWORD_RECOVERY_ENABLED: ${{ vars.ADC_PASSWORD_RECOVERY_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref_name == (vars.ADC_PAGES_BRANCH || 'log-in')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
